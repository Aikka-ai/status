# Public status page for aikka and PharmaGEO.
# Workflows run with the built-in GITHUB_TOKEN (no personal access token).
# The template auto-update workflows (setup, update-template, updates) were removed on purpose:
# they rewrite .github/workflows, which GITHUB_TOKEN cannot push, and pull upptime@master nightly.
# To upgrade Upptime, bump the pinned version in .github/workflows/*.yml through a pull request.
owner: Aikka-ai
repo: status

skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

# Downtime issues are assigned here, so GitHub notifies the on-call engineer.
assignees:
  - AikkaPharma

sites:
  - name: aikka website
    slug: aikka-website
    url: https://aikka.ai
    maxResponseTime: 15000
  - name: aikka platform API
    slug: aikka-platform-api
    url: https://api-aikka-store-back-prod.aikka.ai/health
    maxResponseTime: 15000
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: aikka data API
    slug: aikka-data-api
    url: https://api-aikka-data-prod.aikka.ai/health
    maxResponseTime: 15000
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: PharmaGEO website
    slug: pharmageo-website
    url: https://pharma-geo.com
    maxResponseTime: 15000
  - name: PharmaGEO application
    slug: pharmageo-application
    url: https://app.pharma-geo.com
    maxResponseTime: 15000
  - name: PharmaGEO API
    slug: pharmageo-api
    url: https://api.aikka-pharma.com/health
    maxResponseTime: 15000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

graphBorderColor: "#404EFF"
graphBackgroundColor: "#F5F4EF"

status-website:
  cname: status.aikka.ai
  logoUrl: https://aikka.ai/favicon.svg
  name: aikka status
  introTitle: "Service status for **aikka** and **PharmaGEO**"
  introMessage: "Availability of our websites, applications and APIs, checked every 5 minutes from outside our infrastructure. Incidents are posted on this page. Questions: [contact@aikka.ai](mailto:contact@aikka.ai)"
  theme: light
  navbar:
    - title: aikka
      href: https://aikka.ai
    - title: PharmaGEO
      href: https://pharma-geo.com
  # aikka brand palette only (Figma): Ink, Orange, Signal, Soft White, Dwell, Cream, Paper; Ember as a rule line.
  css: >-
    :root{
    --body-background-color:#F5F4EF;--body-text-color:#000000;
    --card-background-color:#FFFFFF;--card-border-color:#F5F4EF;
    --nav-background-color:#FFFFFF;--nav-border-bottom-color:#F5F4EF;--nav-current-border-bottom-color:#FF4000;
    --up-border-left-color:#404EFF;--down-border-left-color:#FF4000;--degraded-border-left-color:#F36E40;
    --down-background-color:#FFFED9;--change-background-color:#FFFED9;
    --tag-color:#FFFFFF;--tag-up-background-color:#404EFF;--tag-down-background-color:#FF4000;--tag-degraded-background-color:#403233;
    --error-button-border-color:#000000;--error-button-background-color:#000000;--error-button-color:#FFFFFF;
    --submit-button-border-color:#000000;--submit-button-background-color:#000000;--submit-button-color:#FFFFFF;
    --graph-opacity:1;--graph-filter:none}
